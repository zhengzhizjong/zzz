server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: zjt-platform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/zjt_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: zjt
    password: zjt2024pwd
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
  redis:
    host: localhost
    port: 6379
    database: 0
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.zhongjitang.**.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    com.zhongjitang: debug

ai:
  deepseek:
    api-key: ${AI_DEEPSEEK_API_KEY:sk-placeholder}
    base-url: https://api.deepseek.com/v1
    default-model: deepseek-chat
  qwen:
    api-key: ${AI_QWEN_API_KEY:sk-placeholder}
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    default-model: qwen-plus
  gateway:
    rate-limit-per-minute: 60
    circuit-failure-threshold: 0.5
    circuit-window-minutes: 5
